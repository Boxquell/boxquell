[package]
name = "boxquell-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Desktop window for Boxquell"

# Built on its own, not as part of the workspace: it needs the system's
# webview libraries, which the command-line tool does not.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
boxquell-core = { path = "../../../crates/boxquell-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
