<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Boxquell</title>
    <style>
      body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: light-dark(#f2f2f7, #000); color: light-dark(#000, #fff); }
      main { max-width: 460px; text-align: center; padding: 24px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: light-dark(rgb(60 60 67 / 0.7), rgb(235 235 245 / 0.65)); margin: 6px 0; }
      code { font: 13px ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Boxquell could not start</h1>
      <p id="reason">Its background service did not come up.</p>
      <p>Check that the <code>boxquell</code> command is installed and that <code>boxquell doctor</code> is happy, then open the app again.</p>
    </main>
    <script>
      // The app passes the reason in the fragment when it has one.
      const reason = decodeURIComponent(location.hash.slice(1));
      if (reason) document.getElementById("reason").textContent = reason;
    </script>
  </body>
</html>
