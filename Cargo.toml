[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
libloading = "0.9"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
boxquell-net = { path = "crates/boxquell-net" }
boxquell-vm = { path = "crates/boxquell-vm" }
boxquell-core = { path = "crates/boxquell-core" }
