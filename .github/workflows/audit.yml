name: Dependency audit

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "ui/package.json", "ui/package-lock.json", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "ui/package.json", "ui/package-lock.json"]
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  ui:
    name: npm advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit what ships in the binary
        working-directory: ui
        run: npm audit --omit=dev --audit-level=moderate
