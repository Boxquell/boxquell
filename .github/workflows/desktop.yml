name: Desktop app

# Builds the desktop app's packages: an AppImage and a .deb for Linux, an .app
# for macOS and an installer for Windows. Runs for changes to the app, on
# request, and as part of a release (release.yml), which attaches the files.

on:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to build; the repository's own when empty
        type: string
        default: ""
      sign:
        description: Sign the packages with the secrets of the release environment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Signing secrets live in the release environment (docs/release-signing.md).
    environment: ${{ inputs.sign && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: app }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bundles: app }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set the version
        if: inputs.version != ''
        shell: bash
        run: scripts/set-version.sh "${{ inputs.version }}"
      - name: Install what the Linux build needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      # ---- Windows: Certum certificate through SimplySign Desktop ----
      - name: Check Windows signing setup
        id: certum
        if: runner.os == 'Windows' && inputs.sign
        shell: bash
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          for v in CERTUM_USER CERTUM_TOTP_SECRET CERTUM_CERT_SHA1; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::$v is not set in the release environment: the desktop app's installer is published unsigned."
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Certum's official installer, pinned by version and checksum. A new version
      # needs a new checksum (docs/release-signing.md).
      - name: Install SimplySign Desktop
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIMPLYSIGN_VERSION: 9.4.5.95
          SIMPLYSIGN_SHA256: 6309e8b46f1f4e786288e777aef515a2c30d885165b71a21191e9941badebd6b
        run: |
          $version = $env:SIMPLYSIGN_VERSION
          $msi = "$env:RUNNER_TEMP\SimplySignDesktop.msi"
          Invoke-WebRequest "https://files.certum.eu/software/SimplySignDesktop/Windows/$version/SimplySignDesktop-$version-64-bit-en.msi" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne $env:SIMPLYSIGN_SHA256) { throw "SimplySign Desktop installer checksum mismatch: $hash" }
          $proc = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\simplysign-install.log`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "SimplySign Desktop installation failed (msiexec exit code $($proc.ExitCode))." }

      - name: Check the TOTP generator
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/ci/totp.test.ps1

      # Types the account and a fresh TOTP code into SimplySign Desktop. Fragile by
      # nature; when it fails, the release fails and the maintainer signs by hand.
      - name: Log in to SimplySign
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        timeout-minutes: 10
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          Write-Host "::add-mask::$env:CERTUM_USER"
          ./scripts/ci/simplysign-login.ps1

      # ---- macOS: Developer ID and notarization, done by the bundler from these values ----
      - name: Prepare macOS signing
        id: apple
        if: runner.os == 'macOS' && inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::Apple secret $v is not set: the desktop app is signed ad hoc only and not notarized."
              exit 0
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: apps/desktop
        shell: bash
        env:
          # Handed to the bundler below only when signing is set up: an empty
          # identity would make it try to sign with nothing.
          SIGN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SIGN_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SIGN_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SIGN_APPLE_API_KEY_PATH: ${{ steps.apple.outputs.key_path }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          npm ci
          if [[ "${{ steps.apple.outputs.enabled }}" == "true" ]]; then
            export APPLE_CERTIFICATE="$SIGN_APPLE_CERTIFICATE" APPLE_CERTIFICATE_PASSWORD="$SIGN_APPLE_CERTIFICATE_PASSWORD" APPLE_SIGNING_IDENTITY="$SIGN_APPLE_SIGNING_IDENTITY"
            export APPLE_API_ISSUER="$SIGN_APPLE_API_ISSUER" APPLE_API_KEY="$SIGN_APPLE_API_KEY" APPLE_API_KEY_PATH="$SIGN_APPLE_API_KEY_PATH"
            # The configuration asks for an ad hoc signature; a release gets the real identity.
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}}"
          elif [[ "${{ steps.certum.outputs.enabled }}" == "true" ]]; then
            # The bundler signs the program and its installer with the same script as boxquell.exe.
            script=$(cygpath -m "$GITHUB_WORKSPACE/scripts/sign-windows.ps1")
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "{\"bundle\":{\"windows\":{\"signCommand\":{\"cmd\":\"pwsh\",\"args\":[\"-NoProfile\",\"-File\",\"$script\",\"%1\"]}}}}"
          else
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          fi
      # One name scheme for every platform: boxquell-desktop-<version>-<target>.<kind>
      - name: Collect the packages
        shell: bash
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' apps/desktop/src-tauri/tauri.conf.json)
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          name="boxquell-desktop-$version-${{ matrix.target }}"
          mkdir dist
          case "$RUNNER_OS" in
            Linux)
              cp "$bundle"/appimage/*.AppImage "dist/$name.AppImage"
              cp "$bundle"/deb/*.deb "dist/$name.deb"
              ;;
            macOS)
              test -d "$bundle/macos/Boxquell.app"
              codesign --verify --deep --strict "$bundle/macos/Boxquell.app"
              if [[ "${{ steps.apple.outputs.enabled }}" == "true" ]]; then
                # A notarized app carries its ticket, so it opens without asking Apple.
                xcrun stapler validate "$bundle/macos/Boxquell.app" || echo "::warning::The app has no stapled notarization ticket; it opens only after an online check."
              fi
              tar -czf "dist/$name.app.tar.gz" -C "$bundle/macos" Boxquell.app
              ;;
            Windows)
              cp "$bundle"/nsis/*-setup.exe "dist/$name-setup.exe"
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: boxquell-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
