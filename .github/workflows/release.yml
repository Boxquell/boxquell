name: Release

# Builds, signs and publishes the binaries for a version tag.
# Signing is set up in the `release` environment (docs/release-signing.md). A
# platform whose secrets are missing is built unsigned, with a warning.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the web UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p boxquell

      # ---- macOS: Developer ID signature with the hardened runtime, then notarization ----
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          binary="target/${{ matrix.target }}/release/boxquell"
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::Apple secret $v is not set: the macOS binary is signed ad hoc only and not notarized."
              # Without the hypervisor entitlement the binary could not start a VM at all.
              codesign --force --sign - --entitlements assets/entitlements.plist "$binary"
              exit 0
            fi
          done

          # The certificate lives in a keychain that exists for this job only.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          codesign --force --timestamp --options runtime --entitlements assets/entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          # A bare binary cannot carry a stapled ticket; notarizing registers it with
          # Apple so Gatekeeper accepts it after an online check.
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          ditto -c -k "$binary" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key_path" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          rm "$key_path"
          security delete-keychain "$keychain"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      # ---- Windows: Certum certificate through SimplySign Desktop ----
      - name: Check Windows signing setup
        id: certum
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          for v in CERTUM_USER CERTUM_TOTP_SECRET CERTUM_CERT_SHA1; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::$v is not set in the release environment: boxquell.exe is published unsigned."
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Certum's official installer, pinned by version and checksum. A new version
      # needs a new checksum (docs/release-signing.md).
      - name: Install SimplySign Desktop
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIMPLYSIGN_VERSION: 9.4.5.95
          SIMPLYSIGN_SHA256: 6309e8b46f1f4e786288e777aef515a2c30d885165b71a21191e9941badebd6b
        run: |
          $version = $env:SIMPLYSIGN_VERSION
          $msi = "$env:RUNNER_TEMP\SimplySignDesktop.msi"
          Invoke-WebRequest "https://files.certum.eu/software/SimplySignDesktop/Windows/$version/SimplySignDesktop-$version-64-bit-en.msi" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne $env:SIMPLYSIGN_SHA256) { throw "SimplySign Desktop installer checksum mismatch: $hash" }
          $proc = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\simplysign-install.log`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "SimplySign Desktop installation failed (msiexec exit code $($proc.ExitCode))." }

      - name: Check the TOTP generator
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/ci/totp.test.ps1

      # Types the account and a fresh TOTP code into SimplySign Desktop. Fragile by
      # nature; when it fails, the release fails and the maintainer signs by hand.
      - name: Log in to SimplySign
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        timeout-minutes: 10
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          Write-Host "::add-mask::$env:CERTUM_USER"
          ./scripts/ci/simplysign-login.ps1

      - name: Sign (Windows)
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          ./scripts/sign-windows.ps1 "target\${{ matrix.target }}\release\boxquell.exe"
          "SIGNED=true" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package
        shell: bash
        run: |
          name="boxquell-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/boxquell.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/boxquell" "$name/"
            # ditto would be the macOS way, but tar keeps the signature of a single binary intact.
            tar -czf "$name.tar.gz" "$name"
          fi
          if [ "$RUNNER_OS" != Linux ] && [ "${SIGNED:-}" != true ]; then
            echo "::warning::$name is not signed."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: boxquell-${{ matrix.target }}
          path: |
            boxquell-*.tar.gz
            boxquell-*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum boxquell-* > SHA256SUMS
      # A signed statement that these files were built by this workflow from this commit.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "boxquell-*"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            boxquell-*
            SHA256SUMS
          generate_release_notes: true
