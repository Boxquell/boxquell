name: Release

# A version tag builds, signs and drafts a release; a maintainer publishes it.
# The process is described in RELEASING.md. Signing is set up in the `release`
# environment (docs/release-signing.md); a platform whose secrets are missing
# is built unsigned, with a warning.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: |
          version=$(scripts/release-tag.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case $version in *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          # The version must be writable everywhere before anything is built.
          scripts/set-version.sh "$version"
          # A release needs something to say.
          test -n "$(scripts/changelog-section.sh "$version" | tr -d '[:space:]')" || { echo "::error::CHANGELOG.md has no entries for $version or Unreleased"; exit 1; }

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The tag decides the version; the repository is synced afterwards (post-release.yml).
      - name: Set the version
        shell: bash
        run: scripts/set-version.sh "${{ needs.guard.outputs.version }}"
      - name: Build the web UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p boxquell

      # ---- macOS: Developer ID signature with the hardened runtime, then notarization ----
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          binary="target/${{ matrix.target }}/release/boxquell"
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::Apple secret $v is not set: the macOS binary is signed ad hoc only and not notarized."
              # Without the hypervisor entitlement the binary could not start a VM at all.
              codesign --force --sign - --entitlements assets/entitlements.plist "$binary"
              exit 0
            fi
          done

          # The certificate lives in a keychain that exists for this job only.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          codesign --force --timestamp --options runtime --entitlements assets/entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          # A bare binary cannot carry a stapled ticket; notarizing registers it with
          # Apple so Gatekeeper accepts it after an online check.
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          ditto -c -k "$binary" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key_path" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          rm "$key_path"
          security delete-keychain "$keychain"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      # ---- Windows: Certum certificate through SimplySign Desktop ----
      - name: Check Windows signing setup
        id: certum
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          for v in CERTUM_USER CERTUM_TOTP_SECRET CERTUM_CERT_SHA1; do
            if [[ -z "${!v}" ]]; then
              echo "::warning::$v is not set in the release environment: boxquell.exe is published unsigned."
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Certum's official installer, pinned by version and checksum. A new version
      # needs a new checksum (docs/release-signing.md).
      - name: Install SimplySign Desktop
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIMPLYSIGN_VERSION: 9.4.5.95
          SIMPLYSIGN_SHA256: 6309e8b46f1f4e786288e777aef515a2c30d885165b71a21191e9941badebd6b
        run: |
          $version = $env:SIMPLYSIGN_VERSION
          $msi = "$env:RUNNER_TEMP\SimplySignDesktop.msi"
          Invoke-WebRequest "https://files.certum.eu/software/SimplySignDesktop/Windows/$version/SimplySignDesktop-$version-64-bit-en.msi" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne $env:SIMPLYSIGN_SHA256) { throw "SimplySign Desktop installer checksum mismatch: $hash" }
          $proc = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\simplysign-install.log`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "SimplySign Desktop installation failed (msiexec exit code $($proc.ExitCode))." }

      - name: Check the TOTP generator
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/ci/totp.test.ps1

      # Types the account and a fresh TOTP code into SimplySign Desktop. Fragile by
      # nature; when it fails, the release fails and the maintainer signs by hand.
      - name: Log in to SimplySign
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        timeout-minutes: 10
        env:
          CERTUM_USER: ${{ secrets.CERTUM_USER }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          Write-Host "::add-mask::$env:CERTUM_USER"
          ./scripts/ci/simplysign-login.ps1

      - name: Sign (Windows)
        if: steps.certum.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
        run: |
          ./scripts/sign-windows.ps1 "target\${{ matrix.target }}\release\boxquell.exe"
          "SIGNED=true" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package
        shell: bash
        run: |
          name="boxquell-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/boxquell.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/boxquell" "$name/"
            # ditto would be the macOS way, but tar keeps the signature of a single binary intact.
            tar -czf "$name.tar.gz" "$name"
          fi
          if [ "$RUNNER_OS" != Linux ] && [ "${SIGNED:-}" != true ]; then
            echo "::warning::$name is not signed."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: boxquell-${{ matrix.target }}
          path: |
            boxquell-*.tar.gz
            boxquell-*.zip
          if-no-files-found: error

  # The desktop app's packages. The installers add it next to the command.
  desktop:
    name: Desktop app
    needs: guard
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.guard.outputs.version }}
      sign: true

  sbom:
    name: Software bill of materials
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-cyclonedx
      # Everything that ends up in the binary, in CycloneDX form: the Rust
      # crates of the command, and the npm packages of the embedded interface.
      - name: Generate
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          scripts/set-version.sh "$VERSION"
          mkdir sbom
          cargo cyclonedx --manifest-path crates/boxquell/Cargo.toml --format json --spec-version 1.5 --override-filename sbom
          mv crates/boxquell/sbom.json "sbom/boxquell-$VERSION.rust.cdx.json"
          (cd ui && npm ci && npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file "../sbom/boxquell-$VERSION.ui.cdx.json")
          ls -l sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  release:
    name: Draft release
    needs: [guard, build, desktop, sbom]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cd dist
          sha256sum boxquell-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      # A signed statement that these files were built by this workflow from this commit.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh"
            echo "# or: brew install boxquell/tap/boxquell"
            echo "# Windows (PowerShell): irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex"
            echo '```'
            echo
            echo "Check a download with \`SHA256SUMS\`, and where it was built with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "## What's new"
            echo
            scripts/changelog-section.sh "$VERSION"
          } > notes.md
          cat notes.md
      # A draft first: a maintainer looks at the files and publishes.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          flags="--draft --verify-tag --notes-file notes.md --title \"Boxquell $VERSION\""
          if [ "$PRERELEASE" = true ]; then flags="$flags --prerelease --latest=false"; fi
          eval gh release create "$GITHUB_REF_NAME" dist/boxquell-* dist/install.sh dist/install.ps1 dist/SHA256SUMS $flags
