name: Post-release

# After a release is published: bring the repository in step with it (version
# and changelog date, as a pull request) and point the Homebrew tap at it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync version and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      final: ${{ steps.tag.outputs.final }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(RELEASE_TAG_SKIP_BRANCH_CHECK=1 scripts/release-tag.sh "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Release candidates leave the repository and the tap alone.
          case $version in *-rc.*) echo "final=false" >> "$GITHUB_OUTPUT" ;; *) echo "final=true" >> "$GITHUB_OUTPUT" ;; esac
      - name: Update version and changelog
        if: steps.tag.outputs.final == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          scripts/set-version.sh "$VERSION"
          scripts/finalise-changelog.sh "$VERSION" "$(git log -1 --format=%cs "$TAG")"
      - name: Open a pull request
        if: steps.tag.outputs.final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "The repository already matches $VERSION."
            exit 0
          fi
          branch="chore/sync-version-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -qam "chore: sync version $VERSION"
          git push --force origin "$branch"
          # Needs "Allow GitHub Actions to create pull requests" in the repository settings.
          gh pr create --base main --head "$branch" --title "chore: sync version $VERSION" \
            --body "Sets the version to $VERSION and dates its changelog section, after the release was published." \
            || echo "::warning::The branch $branch is pushed, but the pull request could not be opened. Open it by hand, or allow Actions to create pull requests."

  homebrew:
    name: Update the Homebrew tap
    needs: sync
    if: needs.sync.outputs.final == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the tap was not updated. Run scripts/homebrew-formula.sh by hand (RELEASING.md)."
            exit 0
          fi
          gh release download "v$VERSION" --pattern SHA256SUMS --dir .
          scripts/homebrew-formula.sh "$VERSION" SHA256SUMS > boxquell.rb
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/Boxquell/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp boxquell.rb tap/Formula/boxquell.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/boxquell.rb
          git diff --cached --quiet || git commit -qm "boxquell $VERSION"
          git push origin HEAD
