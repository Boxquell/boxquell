name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a way around a sandbox boundary, please use the private report described in SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran, and their output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `boxquell doctor`
      render: text
  - type: input
    id: system
    attributes:
      label: Operating system and boxquell version
      placeholder: "Arch Linux, boxquell 0.1.0, krun backend"
    validations:
      required: true
